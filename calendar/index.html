<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar | Century High School Key Club</title>

    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        navy: '#002855',
                        gold: '#F2A900',
                        calendar: '#E8F0F7',
                        light: '#F8F9FA'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="../style.css">
</head>
<body class="bg-calendar text-gray-800 font-sans antialiased overflow-x-hidden">
    <!-- Navigation -->
    <header class="glass-nav fixed w-full top-0 z-50 text-white shadow-lg transition-all duration-300">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-20">
                <!-- Logo -->
                <div class="flex-shrink-0 flex items-center gap-3 cursor-pointer" onclick="window.scrollTo(0,0)">
                    <div class="w-12 h-12 bg-white rounded-full flex items-center justify-center p-1 border-2 border-gold">
                        <!-- Placeholder for Key Club Logo DONE !--> 
                        <img src="../images/turtleicon.png" alt="Key Club Logo" class="w-full h-full object-contain rounded-full">
                    </div>
                    <div>
                        <span class="font-bold text-xl tracking-tight block">Century High School</span>
                        <span class="text-gold font-semibold text-sm tracking-wider uppercase">Key Club</span>
                    </div>
                </div>

                <!-- Desktop Menu -->
                <nav class="hidden md:flex space-x-8">
                    <a href="../index.html#home" class="text-white hover:text-gold font-medium transition-colors">Home</a>
                    <a href="../index.html#about" class="text-white hover:text-gold font-medium transition-colors">About Us</a>
                    <a href="../index.html#officers" class="text-white hover:text-gold font-medium transition-colors">Officers</a>
                    <a href="index.html" class="text-white hover:text-gold font-medium transition-colors">Calendar</a>
                    <a href="../index.html#gallery" class="text-white hover:text-gold font-medium transition-colors">Gallery</a>
                </nav>

                <!-- CTA Button (Desktop)
                <div class="hidden md:flex">
                    <a href="../index.html#join" class="bg-gold text-navy font-bold py-2 px-6 rounded-full hover:bg-yellow-400 transform hover:scale-105 transition-all shadow-md">
                        <i class="fas fa-user-plus mr-2" aria-hidden="true"></i>
                        Join Us
                    </a>
                </div> -->

                <!-- Mobile Menu Button -->
                <div class="md:hidden flex items-center">
                    <button id="mobile-menu-btn" class="text-white hover:text-gold focus:outline-none p-2">
                        <i class="fas fa-bars text-2xl"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- Mobile Menu (Hidden by default) -->
        <div id="mobile-menu" class="hidden md:hidden bg-navy border-t border-blue-900">
            <div class="px-2 pt-2 pb-3 space-y-1 sm:px-3">
                <a href="../index.html#home" class="block px-3 py-2 rounded-md text-base font-medium text-white hover:text-gold hover:bg-blue-900">Home</a>
                <a href="../index.html#about" class="block px-3 py-2 rounded-md text-base font-medium text-white hover:text-gold hover:bg-blue-900">About Us</a>
                <a href="../index.html#officers" class="block px-3 py-2 rounded-md text-base font-medium text-white hover:text-gold hover:bg-blue-900">Officers</a>
                <a href="index.html" class="block px-3 py-2 rounded-md text-base font-medium text-white hover:text-gold hover:bg-blue-900">Calendar</a>
                <a href="../index.html#gallery" class="block px-3 py-2 rounded-md text-base font-medium text-white hover:text-gold hover:bg-blue-900">Gallery</a>
                <a href="../index.html#join" class="block px-3 py-2 mt-4 text-center rounded-md text-base font-bold text-navy bg-gold hover:bg-yellow-400"><i class="fas fa-user-plus mr-2" aria-hidden="true"></i>Join Us</a>
            </div>
        </div>
    </header>
    <!-- Events Calendar Section -->
    <section id="calendar" class="py-20 bg-calendar text-navy top-pad" >
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex flex-col md:flex-row justify-between items-end mb-12">
                <div class="md:w-2/3">
                    <h2 class="text-4xl font-bold mb-4 text-black">Upcoming Events</h2>
                    <div class="w-24 h-1 bg-gold rounded-full mb-6"></div>
                    <p class="text-gray-600 text-lg">
                        Stay up-to-date with our latest meetings, service events, and fundraisers. Click on an event for more details and to sign up!
                    </p>
                </div>

                <div class="mt-6 md:mt-0">
                    <a
                        href="https://calendar.google.com/calendar/u/0/r?cid=c_classroomb1a137aa%40group.calendar.google.com"
                        target="_blank"
                        rel="noopener noreferrer"
                        class="inline-flex items-center gap-2 bg-transparent border-2 border-gold text-gold hover:bg-gold hover:text-navy font-bold py-2 px-6 rounded-full transition-colors"
                    >
                        <i class="fab fa-google"></i>
                        Sync Calendar
                    </a>
                </div>
            </div>

            <!-- Calendar Iframe Container -->
            <div class="bg-white rounded-2xl shadow-2xl overflow-hidden p-2 md:p-4">
                <div class="w-full h-[500px] md:h-[600px] lg:h-[700px] relative">
                    <iframe
                        src="https://calendar.google.com/calendar/embed?src=c_classroomb1a137aa%40group.calendar.google.com&ctz=America%2FLos_Angeles"
                        style="border: solid 1px #777;"
                        width="100%"
                        height="100%"
                        frameborder="0"
                        scrolling="no"
                        class="rounded-xl absolute inset-0"
                        title="Our Calendar"
                    ></iframe>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
